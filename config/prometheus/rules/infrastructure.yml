groups:
  # Host CPU/memory/disk alerts are intentionally NOT here: Zabbix owns host metrics.
  - name: targets-and-containers
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 2 minutes."





      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 2
        labels: { severity: warning }
        annotations:
          summary: "Container {{ $labels.name }} is restarting repeatedly"
          description: "More than 2 restarts in 15 minutes."

  - name: availability
    rules:
      - alert: EndpointDown
        expr: probe_success == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} ({{ $labels.instance }}) is unreachable"
          description: "Probe has failed for 2 minutes."

      - alert: EndpointSlow
        expr: probe_duration_seconds{job="blackbox-http"} > 3
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} is responding slowly"
          description: "Response time above 3s for 5 minutes (now {{ $value | printf \"%.1f\" }}s)."

      - alert: TlsCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 21
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires soon"
          description: "{{ $value | printf \"%.0f\" }} days left."

      - alert: TlsCertExpiryCritical
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 7
        for: 1h
        labels: { severity: critical }
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in under 7 days"
          description: "{{ $value | printf \"%.0f\" }} days left."

  - name: tracing
    rules:
      # Uses span metrics generated by Tempo. Only fires once applications send traces.
      - alert: ServiceHighErrorRate
        expr: |
          sum by (service) (rate(traces_spanmetrics_calls_total{status_code="STATUS_CODE_ERROR", span_kind="SPAN_KIND_SERVER"}[5m]))
            / sum by (service) (rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER"}[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Error rate above 5% on service {{ $labels.service }}"
          description: "Derived from traces. Open Tempo to inspect failing requests."
