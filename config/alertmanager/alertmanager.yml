global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: oncall
      repeat_interval: 1h

# A critical alert silences its own warning-level twin for the same alert/instance.
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, instance]

# Tip: prefix notification subjects with "[Obs]" so they are distinguishable from Zabbix alerts, e.g.
#   email_configs: - headers: { Subject: '[Obs] {{ .CommonLabels.alertname }} ({{ .Status }})' }
# Receivers start empty so the stack boots cleanly. Add real notification channels below.
receivers:
