name: observability

services:
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app    # Zabbix data inside Grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus, loki, tempo, alertmanager]
    deploy: { resources: { limits: { memory: 1G } } }

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-remote-write-receiver      # Tempo span-metrics (and remote Alloy) push here
      - --web.enable-lifecycle                  # allows config reload via POST /-/reload
      - --enable-feature=exemplar-storage       # metric -> trace links
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    deploy: { resources: { limits: { memory: 3G } } }

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION}
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./config/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    deploy: { resources: { limits: { memory: 128M } } }

  blackbox:
    image: prom/blackbox-exporter:${BLACKBOX_VERSION}
    restart: unless-stopped
    command: --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./config/blackbox:/etc/blackbox:ro
    deploy: { resources: { limits: { memory: 64M } } }

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION}
    restart: unless-stopped
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    deploy: { resources: { limits: { memory: 256M } } }

  loki:
    image: grafana/loki:${LOKI_VERSION}
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./config/loki.yaml:/etc/loki/loki.yaml:ro
      - ./config/loki-rules:/loki/rules/fake:ro     # log alert rules (tenant "fake" = auth disabled)
      - loki-data:/loki
    deploy: { resources: { limits: { memory: 3G } } }

  tempo:
    image: grafana/tempo:${TEMPO_VERSION}
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yaml
    user: "0:0"
    volumes:
      - ./config/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on: [prometheus]
    deploy: { resources: { limits: { memory: 2G } } }

  alloy:
    image: grafana/alloy:${ALLOY_VERSION}
    restart: unless-stopped
    command: >
      run --server.http.listen-addr=0.0.0.0:12345
      --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "4317:4317"   # OTLP gRPC: applications send traces here
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./config/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki, tempo]
    deploy: { resources: { limits: { memory: 512M } } }

volumes:
  grafana-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  alloy-data:
